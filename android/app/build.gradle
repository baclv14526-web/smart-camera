plugins {
    id "com.android.application"
    // Must use full plugin ID in plugins{} block — 'kotlin-android' alias is NOT
    // resolved from settings.gradle where only 'org.jetbrains.kotlin.android' is declared.
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.camera_app"

    // Dùng giá trị do chính Flutter Gradle Plugin cung cấp
    // thay vì hardcode → tự động khớp với yêu cầu compileSdk
    // của mọi plugin (package_info_plus, flutter_plugin_android_lifecycle...)
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.example.camera_app"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
