buildscript {
    ext.kotlin_version = '1.9.22'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    ext {
        set("flutter", [
            compileSdkVersion: 35,
            minSdkVersion    : 21,
            targetSdkVersion : 35,
            ndkVersion       : "25.1.8937393"
        ])
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.ext {
        set("flutter", [
            compileSdkVersion: 35,
            minSdkVersion    : 21,
            targetSdkVersion : 35,
            ndkVersion       : "25.1.8937393"
        ])
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects {
    def configureProject = { p ->
        if (p.extensions.findByName("android") != null) {
            def android = p.extensions.findByName("android")
            
            // Fix compileSdk / compileSdkVersion for older plugins
            try {
                if (android.hasProperty("compileSdkVersion") && (android.compileSdkVersion == null || android.compileSdkVersion == "")) {
                    android.compileSdkVersion = 35
                }
            } catch (Exception ignored) {}

            // Fix namespace for legacy plugins without namespace
            if (android.hasProperty("namespace") && (android.namespace == null || android.namespace.isEmpty())) {
                def manifestFile = p.file("src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifestContent = manifestFile.text
                    def matcher = manifestContent =~ /package="([^"]+)"/
                    if (matcher.find()) {
                        android.namespace = matcher.group(1)
                    } else {
                        android.namespace = "com.example.${p.name.replace('-', '_')}"
                    }
                } else {
                    android.namespace = "com.example.${p.name.replace('-', '_')}"
                }
            }
        }
    }

    if (project.state.executed) {
        configureProject(project)
    } else {
        project.afterEvaluate {
            configureProject(project)
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
