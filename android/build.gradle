// Với Flutter 3.x + settings.gradle kiểu mới (pluginManagement),
// file này chỉ cần khai báo allprojects repositories — KHÔNG dùng buildscript{}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Fix: rootProject.buildDir bị xóa hoàn toàn ở Gradle 8.8+
// Dùng layout.buildDirectory API thay thế.
rootProject.layout.buildDirectory.set(file("../build"))

subprojects {
    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(project.name))
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
