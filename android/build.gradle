// Với Flutter 3.x + settings.gradle kiểu mới (pluginManagement),
// file này chỉ cần khai báo allprojects repositories — KHÔNG dùng buildscript{}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
