name: camera_app
description: Camera app with timer and quality settings
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  path_provider: ^2.1.2
  path: ^1.9.0
  permission_handler: ^11.3.0
  video_player: ^2.8.6
  wakelock_plus: ^1.2.1
  audioplayers: ^6.1.0
  file_picker: ^8.1.4
  shared_preferences: ^2.3.2
  native_exif: ^0.8.0       # Ghi EXIF metadata vào file JPEG (ISO, GPS, datetime, orientation...)
  geolocator: ^13.0.2       # Lấy tọa độ GPS (latitude, longitude, altitude) để ghi vào EXIF
  image: ^4.2.0             # Encode JPEG (thay thế PNG) để file nhỏ hơn và hỗ trợ EXIF đầy đủ

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
