name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Write local.properties
        run: |
          # Tìm Flutter SDK root (thư mục chứa /bin/flutter)
          FLUTTER_BIN=$(which flutter)
          FLUTTER_ROOT=$(dirname $(dirname $FLUTTER_BIN))
          echo "sdk.dir=$ANDROID_SDK_ROOT"  >  android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT"  >> android/local.properties
          echo "--- local.properties ---"
          cat android/local.properties
          echo "--- Flutter version ---"
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          COMMIT=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD=${{ github.run_number }}
          for f in app-*-release.apk; do
            ABI=$(echo $f | sed 's/app-//' | sed 's/-release.apk//')
            mv "$f" "camera-app-${ABI}-v${BUILD}-${COMMIT}.apk" || true
          done
          echo "--- APK files ---"
          ls -lh *.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camera-app-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            ## 📦 Camera App – Build #${{ github.run_number }}

            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            **Message:** ${{ github.event.head_commit.message }}

            ---

            ### 📥 Chọn file APK phù hợp

            | File | Dành cho |
            |------|----------|
            | `...-arm64-v8a-...` | ✅ Điện thoại mới 64-bit **(khuyên dùng)** |
            | `...-armeabi-v7a-...` | Điện thoại cũ 32-bit |
            | `...-x86_64-...` | Máy ảo / giả lập |

            ### 🔧 Cài đặt
            1. Tải file `arm64-v8a` về điện thoại
            2. Vào **Cài đặt → Bảo mật → Cho phép cài từ nguồn không rõ**
            3. Mở file APK và nhấn Cài đặt
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
