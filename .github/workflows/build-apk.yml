name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Cài Java 17 ──────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Cài Flutter stable ────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      # ── 4. Ghi local.properties ──────────────────────────────────────────────
      - name: Write local.properties
        run: |
          FLUTTER_ROOT="$(dirname $(dirname $(which flutter)))"
          echo "sdk.dir=$ANDROID_SDK_ROOT"     >  android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT"     >> android/local.properties
          echo "flutter.buildMode=release"     >> android/local.properties
          echo "flutter.versionName=1.0.0"     >> android/local.properties
          echo "flutter.versionCode=1"         >> android/local.properties
          echo "=== local.properties ==="
          cat android/local.properties

      # ── 5. Cài dependencies ──────────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── 6. Phân tích code ────────────────────────────────────────────────────
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # ── 7. Build APK release ─────────────────────────────────────────────────
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # ── 8. Đổi tên APK ───────────────────────────────────────────────────────
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          COMMIT=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD=${{ github.run_number }}
          mv app-arm64-v8a-release.apk   camera-app-arm64-v${BUILD}-${COMMIT}.apk   || true
          mv app-armeabi-v7a-release.apk camera-app-armv7-v${BUILD}-${COMMIT}.apk   || true
          mv app-x86_64-release.apk      camera-app-x86_64-v${BUILD}-${COMMIT}.apk  || true
          echo "=== APK files ==="
          ls -lh *.apk

      # ── 9. Upload artifact ────────────────────────────────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camera-app-apk-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      # ── 10. Tạo GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            ## 📦 Camera App – Build #${{ github.run_number }}

            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`

            ### 📥 Tải APK
            | File | Dành cho |
            |------|----------|
            | `camera-app-arm64-*` | ✅ Điện thoại mới 64-bit – **dùng cái này** |
            | `camera-app-armv7-*` | Điện thoại cũ 32-bit |
            | `camera-app-x86_64-*` | Máy ảo / giả lập |

            ### 🔧 Cách cài đặt
            1. Tải file `arm64` về điện thoại
            2. Bật **Cài từ nguồn không rõ** trong Cài đặt
            3. Mở file APK và cài đặt

            ### 📝 Commit
            ${{ github.event.head_commit.message }}
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
