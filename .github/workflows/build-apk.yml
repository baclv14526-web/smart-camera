name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Fix: cần quyền write để softprops/action-gh-release tạo được Release.
# Không có block này → GITHUB_TOKEN chỉ có read → bước tạo Release trả về 403.
permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Dùng bản Flutter STABLE MỚI NHẤT (không pin version cũ) ──────────────
      # Lý do: Flutter 3.24.x có bug không đọc đúng flutter.compileSdkVersion
      # cho các plugin yêu cầu compileSdk 35 (package_info_plus,
      # flutter_plugin_android_lifecycle...). Bug này đã được fix trong các
      # bản Flutter mới hơn → xem: github.com/flutter/flutter/issues/164369
      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write local.properties
        run: |
          FLUTTER_BIN=$(which flutter)
          FLUTTER_ROOT=$(dirname $(dirname $FLUTTER_BIN))
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "flutter.sdk=$FLUTTER_ROOT"
          } > android/local.properties
          echo "--- local.properties ---"
          cat android/local.properties
          echo "--- Flutter version ---"
          flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Fix: dùng đường dẫn tuyệt đối đến sdkmanager thay vì phụ thuộc PATH
      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || \
          yes | sdkmanager --licenses > /dev/null 2>&1 || \
          echo "sdkmanager license step skipped (non-fatal)"

      # Cache Gradle để build nhanh hơn ở những lần sau (~50% thời gian tiết kiệm)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          COMMIT=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD=${{ github.run_number }}
          for f in app-*-release.apk; do
            ABI=$(echo $f | sed 's/app-//' | sed 's/-release.apk//')
            mv "$f" "camera-app-${ABI}-v${BUILD}-${COMMIT}.apk" || true
          done
          echo "--- APK files ---"
          ls -lh *.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camera-app-build-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            ## 📦 Camera App – Build #${{ github.run_number }}

            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            **Message:** ${{ github.event.head_commit.message }}

            ---

            ### 📥 Chọn file APK phù hợp

            | File | Dành cho |
            |------|----------|
            | `...-arm64-v8a-...` | ✅ Điện thoại mới 64-bit **(khuyên dùng)** |
            | `...-armeabi-v7a-...` | Điện thoại cũ 32-bit |
            | `...-x86_64-...` | Máy ảo / giả lập |

            ### 🔧 Cài đặt
            1. Tải file `arm64-v8a` về điện thoại
            2. Vào **Cài đặt → Bảo mật → Cho phép cài từ nguồn không rõ**
            3. Mở file APK và nhấn Cài đặt
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

